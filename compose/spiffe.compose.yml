services:
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.9.0
    container_name: spiffe-spire-server
    volumes:
      - ../spire/server:/run/spire/server
      - ../spire/server/server.conf:/run/spire/server/server.conf:ro
      - ../spire/shared:/run/spire/shared
    command: ["-config", "/run/spire/server/server.conf"]

  spire-token-init:
    build: ../spire/token-init
    container_name: spiffe-spire-token-init
    depends_on:
      - spire-server
    volumes:
      - ../spire/server:/run/spire/server
      - ../spire/shared:/run/spire/shared

  spire-agent:
    build: ../spire/agent-wrapper
    container_name: spiffe-spire-agent
    pid: host
    labels:
      spiffe.node: "true"
    depends_on:
      - spire-server
      - spire-token-init
    volumes:
      - ../spire/agent:/run/spire/agent
      - ../spire/agent/agent.conf:/run/spire/agent/agent.conf:ro
      - ../spire/shared:/run/spire/shared
      - /var/run/docker.sock:/var/run/docker.sock:ro

  spire-rogue-agent:
    image: ghcr.io/spiffe/spire-agent:1.9.0
    container_name: spiffe-spire-rogue-agent
    depends_on:
      - spire-server
      - spire-token-init
      - spire-agent
    volumes:
      - ../spire/rogue:/run/spire/rogue
      - ../spire/rogue/agent.conf:/run/spire/rogue/agent.conf:ro
    command: ["run", "-config", "/run/spire/rogue/agent.conf", "-joinToken", "not-a-real-token"]
    profiles:
      - tests

  rogue-socket:
    build: ../agents/rogue
    container_name: spiffe-rogue-socket
    depends_on:
      - spire-agent
    volumes:
      - ../spire/agent:/run/spire/agent:ro
    command: ["sleep", "infinity"]
    profiles:
      - tests

  rogue-tests:
    build:
      context: ..
      dockerfile: spire/rogue-tests/Dockerfile
    container_name: spiffe-rogue-tests
    depends_on:
      - spire-server
      - spire-token-init
      - spire-agent
      - spire-rogue-agent
      - rogue-socket
      - tool-b-envoy
      - capability-issuer-envoy
      - capability-issuer-no-opa-envoy
      - agent-a
      - rogue
    volumes:
      - ../spire/rogue:/run/spire/rogue
      - ../spire/shared:/run/spire/shared:ro
      - ..:/repo
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      TEST_LOG_FILE: /repo/test_report.log
    networks:
      - toolb_edge_net
      - capiss_edge_net
    profiles:
      - tests

  tool-b:
    build: ../services/tool-b
    container_name: spiffe-tool-b
    labels:
      spiffe.workload: "tool-b"
    environment:
      ALLOWED_CLIENT_SPIFFE_ID: spiffe://example.org/agent-a
    volumes:
      - ../spire/agent:/run/spire/agent:ro
    networks:
      - toolb_app_net

  tool-b-envoy:
    build: ../services/tool-b-envoy
    container_name: spiffe-tool-b-envoy
    labels:
      spiffe.workload: "tool-b-envoy"
    depends_on:
      - spire-agent
      - tool-b
    ports:
      - "8443:8443"
    volumes:
      - ../spire/agent:/run/spire/agent:ro
    networks:
      - toolb_edge_net
      - toolb_app_net

  capability-issuer:
    build: ../services/capability-issuer
    container_name: spiffe-capability-issuer
    labels:
      spiffe.workload: "capability-issuer"
    networks:
      - capiss_app_net
    depends_on:
      - opa

  capability-issuer-envoy:
    build: ../services/capability-issuer-envoy
    container_name: spiffe-capability-issuer-envoy
    labels:
      spiffe.workload: "capability-issuer-envoy"
    depends_on:
      - spire-agent
      - capability-issuer
    ports:
      - "9443:9443"
    volumes:
      - ../spire/agent:/run/spire/agent:ro
    networks:
      - capiss_edge_net
      - capiss_app_net

  capability-issuer-no-opa:
    build: ../services/capability-issuer
    container_name: spiffe-capability-issuer-no-opa
    labels:
      spiffe.workload: "capability-issuer-no-opa"
    environment:
      OPA_URL: http://opa-missing:8181/v1/data/capiss/allow
    networks:
      - capiss_app_net
    profiles:
      - tests

  capability-issuer-no-opa-envoy:
    build: ../services/capability-issuer-envoy
    container_name: spiffe-capability-issuer-no-opa-envoy
    labels:
      spiffe.workload: "capability-issuer-no-opa-envoy"
    depends_on:
      - spire-agent
      - capability-issuer-no-opa
    volumes:
      - ../spire/agent:/run/spire/agent:ro
      - ../services/capability-issuer-envoy/envoy-no-opa.yaml:/etc/envoy/envoy.yaml:ro
    networks:
      - capiss_edge_net
      - capiss_app_net
    profiles:
      - tests

  opa:
    image: openpolicyagent/opa:latest
    container_name: spiffe-opa
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies/policy.rego"]
    volumes:
      - ../services/opa:/policies:ro
    networks:
      - capiss_app_net

  agent-a:
    build: ../agents/agent-a
    container_name: spiffe-agent-a
    labels:
      spiffe.workload: "agent-a"
    depends_on:
      - tool-b-envoy
      - capability-issuer-envoy
    environment:
      TOOL_B_URL: https://tool-b-envoy:8443
      CAPABILITY_ISSUER_URL: https://capability-issuer-envoy:9443
    command: ["/app/client.sh"]
    volumes:
      - ../spire/agent:/run/spire/agent:ro
    networks:
      - toolb_edge_net
      - capiss_edge_net
    profiles:
      - clients
      - tests

  rogue:
    build: ../agents/rogue
    container_name: spiffe-rogue
    labels:
      spiffe.workload: "rogue"
    depends_on:
      - tool-b-envoy
    environment:
      TOOL_B_URL: https://tool-b-envoy:8443
    command: ["/app/rogue.sh"]
    volumes:
      - ../spire/agent:/run/spire/agent:ro
    networks:
      - toolb_edge_net
      - capiss_edge_net
    profiles:
      - clients
      - tests

networks:
  toolb_edge_net: {}
  toolb_app_net: {}
  capiss_edge_net: {}
  capiss_app_net: {}
