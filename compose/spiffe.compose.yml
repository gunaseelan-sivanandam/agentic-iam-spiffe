services:
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.9.0
    container_name: spiffe-spire-server
    volumes:
      - ../spire/server:/run/spire/server
      - ../spire/server/server.conf:/run/spire/server/server.conf:ro
      - ../spire/shared:/run/spire/shared
    command: ["-config", "/run/spire/server/server.conf"]

  spire-token-init:
    build: ../spire/token-init
    container_name: spiffe-spire-token-init
    depends_on:
      - spire-server
    volumes:
      - ../spire/server:/run/spire/server
      - ../spire/shared:/run/spire/shared

  spire-agent:
    build: ../spire/agent-wrapper
    container_name: spiffe-spire-agent
    pid: host
    labels:
      spiffe.node: "true"
    depends_on:
      - spire-server
      - spire-token-init
    volumes:
      - ../spire/agent:/run/spire/agent
      - ../spire/agent/agent.conf:/run/spire/agent/agent.conf:ro
      - ../spire/shared:/run/spire/shared
      - /var/run/docker.sock:/var/run/docker.sock:ro

  spire-rogue-agent:
    image: ghcr.io/spiffe/spire-agent:1.9.0
    container_name: spiffe-spire-rogue-agent
    depends_on:
      - spire-server
      - spire-token-init
      - spire-agent
    volumes:
      - ../spire/rogue:/run/spire/rogue
      - ../spire/rogue/agent.conf:/run/spire/rogue/agent.conf:ro
    command: ["run", "-config", "/run/spire/rogue/agent.conf", "-joinToken", "not-a-real-token"]
    profiles:
      - tests

  rogue-socket:
    build: ../agents/rogue
    container_name: spiffe-rogue-socket
    depends_on:
      - spire-agent
    volumes:
      - ../spire/agent:/run/spire/agent:ro
    command: ["sleep", "infinity"]
    profiles:
      - tests

  rogue-tests:
    build:
      context: ..
      dockerfile: spire/rogue-tests/Dockerfile
    container_name: spiffe-rogue-tests
    depends_on:
      spire-server:
        condition: service_started
      spire-token-init:
        condition: service_started
      spire-agent:
        condition: service_started
      spire-rogue-agent:
        condition: service_started
      rogue-socket:
        condition: service_started
      tool-b-envoy:
        condition: service_healthy
      capability-issuer-envoy:
        condition: service_healthy
      capability-issuer-no-opa-envoy:
        condition: service_healthy
      jira-tool-envoy:
        condition: service_healthy
      jira-mock:
        condition: service_started
      codex-jira-mcp-adapter:
        condition: service_healthy
      jira-mcp-envoy:
        condition: service_healthy
      jira-mcp-gateway:
        condition: service_healthy
      jira-mcp-mock:
        condition: service_started
      agent-a:
        condition: service_started
      rogue:
        condition: service_started
    volumes:
      - ../spire/rogue:/run/spire/rogue
      - ../spire/shared:/run/spire/shared:ro
      - ..:/repo
      - ../artifacts/rogue-tests:/tmp/rogue-tests
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      TEST_LOG_FILE: /repo/test_report.log
    networks:
      - default
      - toolb_edge_net
      - capiss_edge_net
      - jiratool_edge_net
      - jiratool_upstream_net
      - jiramcp_edge_net
      - jiramcp_upstream_net
    profiles:
      - tests

  tool-b:
    build:
      context: ..
      dockerfile: services/tool-b/Dockerfile
    container_name: spiffe-tool-b
    labels:
      spiffe.workload: "tool-b"
    environment:
      CAPISS_PUBLIC_KEY_PATH: /var/lib/capiss/keys/root_public_key.b64
      REDIS_URL: redis://redis:6379/0
      M4_MAX_DEPTH: "3"
      M4_RATE_LIMIT: "20"
      M4_RATE_WINDOW_SECONDS: "10"
      M4_REQUEST_COST: "1"
    volumes:
      - ../capiss_keys:/var/lib/capiss/keys:ro
      - ../spire/agent:/run/spire/agent:ro
    depends_on:
      - redis
    networks:
      - toolb_app_net

  tool-b-envoy:
    build: ../services/tool-b-envoy
    container_name: spiffe-tool-b-envoy
    labels:
      spiffe.workload: "tool-b-envoy"
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/spire/svid/svid.pem && test -s /run/spire/svid/svid.key"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 90s
    depends_on:
      - spire-agent
      - tool-b
    ports:
      - "8443:8443"
    volumes:
      - ../spire/agent:/run/spire/agent:ro
    networks:
      - toolb_edge_net
      - toolb_app_net

  jira-mock:
    build:
      context: ..
      dockerfile: services/jira-mock/Dockerfile
    container_name: spiffe-jira-mock
    networks:
      - jiratool_upstream_net

  jira-tool:
    build:
      context: ..
      dockerfile: services/jira-tool/Dockerfile
    container_name: spiffe-jira-tool
    labels:
      spiffe.workload: "jira-tool"
    environment:
      CAPISS_PUBLIC_KEY_PATH: /var/lib/capiss/keys/root_public_key.b64
      REDIS_URL: redis://redis:6379/0
      M4_MAX_DEPTH: "3"
      M4_RATE_LIMIT: "20"
      M4_RATE_WINDOW_SECONDS: "10"
      M4_REQUEST_COST: "1"
      JIRA_UPSTREAM_MODE: ${JIRA_UPSTREAM_MODE:-mock}
      JIRA_MOCK_BASE_URL: http://jira-mock:8080
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
    volumes:
      - ../capiss_keys:/var/lib/capiss/keys:ro
      - ../spire/agent:/run/spire/agent:ro
    depends_on:
      - spire-agent
      - redis
      - jira-mock
    networks:
      - jiratool_app_net
      - jiratool_upstream_net

  jira-tool-envoy:
    build: ../services/jira-tool-envoy
    container_name: spiffe-jira-tool-envoy
    labels:
      spiffe.workload: "jira-tool-envoy"
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/spire/svid/svid.pem && test -s /run/spire/svid/svid.key"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 90s
    depends_on:
      - spire-agent
      - jira-tool
    ports:
      - "10443:10443"
    volumes:
      - ../spire/agent:/run/spire/agent:ro
    networks:
      - jiratool_edge_net
      - jiratool_app_net

  jira-mcp-mock:
    build:
      context: ..
      dockerfile: services/jira-mcp-mock/Dockerfile
    container_name: spiffe-jira-mcp-mock
    networks:
      - jiramcp_app_net
      - jiramcp_upstream_net

  jira-mcp-gateway:
    build:
      context: ..
      dockerfile: services/jira-mcp-gateway/Dockerfile
    container_name: spiffe-jira-mcp-gateway
    labels:
      spiffe.workload: "jira-mcp-gateway"
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/spire/svid/svid.pem && test -s /run/spire/svid/svid.key"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 90s
    environment:
      CAPISS_PUBLIC_KEY_PATH: /var/lib/capiss/keys/root_public_key.b64
      REDIS_URL: redis://redis:6379/0
      M4_MAX_DEPTH: "3"
      M4_RATE_LIMIT: "20"
      M4_RATE_WINDOW_SECONDS: "10"
      M4_REQUEST_COST: "1"
      JIRA_MCP_UPSTREAM_MODE: ${JIRA_MCP_UPSTREAM_MODE:-mock}
      JIRA_MCP_MOCK_BASE_URL: http://jira-mcp-mock:8080
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
    volumes:
      - ../capiss_keys:/var/lib/capiss/keys:ro
      - ../spire/agent:/run/spire/agent:ro
    depends_on:
      - spire-agent
      - redis
      - jira-mcp-mock
    networks:
      - jiramcp_app_net

  jira-mcp-envoy:
    build: ../services/jira-mcp-envoy
    container_name: spiffe-jira-mcp-envoy
    labels:
      spiffe.workload: "jira-mcp-envoy"
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/spire/svid/svid.pem && test -s /run/spire/svid/svid.key"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 90s
    depends_on:
      - spire-agent
      - jira-mcp-gateway
    ports:
      - "11443:11443"
    volumes:
      - ../spire/agent:/run/spire/agent:ro
    networks:
      - jiramcp_edge_net
      - jiramcp_app_net

  codex-jira-mcp-adapter:
    build:
      context: ..
      dockerfile: services/codex-jira-mcp-adapter/Dockerfile
    container_name: spiffe-codex-jira-mcp-adapter
    labels:
      spiffe.workload: "codex-jira-mcp-adapter"
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/spire/svid/svid.pem && test -s /run/spire/svid/svid.key"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 90s
    environment:
      CAPABILITY_ISSUER_URL: https://capability-issuer-envoy:9443
      JIRA_MCP_GATEWAY_URL: https://jira-mcp-envoy:11443
    volumes:
      - ../spire/agent:/run/spire/agent:ro
    depends_on:
      - spire-agent
      - capability-issuer-envoy
      - jira-mcp-envoy
    networks:
      - capiss_edge_net
      - jiramcp_edge_net

  capability-issuer:
    build:
      context: ..
      dockerfile: services/capability-issuer/Dockerfile
    container_name: spiffe-capability-issuer
    labels:
      spiffe.workload: "capability-issuer"
    environment:
      CAPISS_KEY_DIR: /var/lib/capiss/keys
      REDIS_URL: redis://redis:6379/0
      M4_MAX_DEPTH: "3"
      M4_DEFAULT_BUDGET: "10"
      M4_ROOT_TTL_SECONDS: "60"
      VARAMBU_TZ: ${VARAMBU_TZ:-UTC}
    networks:
      - capiss_app_net
    depends_on:
      - opa
      - redis
    volumes:
      - ../capiss_keys:/var/lib/capiss/keys

  capability-issuer-envoy:
    build: ../services/capability-issuer-envoy
    container_name: spiffe-capability-issuer-envoy
    labels:
      spiffe.workload: "capability-issuer-envoy"
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/spire/svid/svid.pem && test -s /run/spire/svid/svid.key"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 90s
    depends_on:
      - spire-agent
      - capability-issuer
    ports:
      - "9443:9443"
    volumes:
      - ../spire/agent:/run/spire/agent:ro
    networks:
      - capiss_edge_net
      - capiss_app_net

  capability-issuer-no-opa:
    build:
      context: ..
      dockerfile: services/capability-issuer/Dockerfile
    container_name: spiffe-capability-issuer-no-opa
    labels:
      spiffe.workload: "capability-issuer-no-opa"
    environment:
      OPA_URL: http://redis:8181/v1/data/capiss/allow
      CAPISS_KEY_DIR: /var/lib/capiss/keys
      REDIS_URL: redis://redis:6379/0
      M4_MAX_DEPTH: "3"
      M4_DEFAULT_BUDGET: "10"
      M4_ROOT_TTL_SECONDS: "60"
      VARAMBU_TZ: ${VARAMBU_TZ:-UTC}
    networks:
      - capiss_app_net
    profiles:
      - tests
    volumes:
      - ../capiss_keys:/var/lib/capiss/keys

  capability-issuer-no-opa-envoy:
    build: ../services/capability-issuer-envoy
    container_name: spiffe-capability-issuer-no-opa-envoy
    labels:
      spiffe.workload: "capability-issuer-no-opa-envoy"
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/spire/svid/svid.pem && test -s /run/spire/svid/svid.key"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 90s
    depends_on:
      - spire-agent
      - capability-issuer-no-opa
    volumes:
      - ../spire/agent:/run/spire/agent:ro
      - ../services/capability-issuer-envoy/envoy-no-opa.yaml:/etc/envoy/envoy.yaml:ro
    networks:
      - capiss_edge_net
      - capiss_app_net
    profiles:
      - tests

  opa:
    image: openpolicyagent/opa:latest
    container_name: spiffe-opa
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies/policy.rego"]
    volumes:
      - ../services/opa:/policies:ro
    networks:
      - capiss_app_net

  redis:
    image: redis:7-alpine
    container_name: spiffe-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - capiss_app_net
      - toolb_app_net
      - jiratool_app_net
      - jiramcp_app_net

  agent-a:
    build: ../agents/agent-a
    container_name: spiffe-agent-a
    labels:
      spiffe.workload: "agent-a"
    depends_on:
      - tool-b-envoy
      - capability-issuer-envoy
      - jira-tool-envoy
    environment:
      TOOL_B_URL: https://tool-b-envoy:8443
      CAPABILITY_ISSUER_URL: https://capability-issuer-envoy:9443
      JIRA_TOOL_URL: https://jira-tool-envoy:10443
    command: ["/app/client.sh"]
    volumes:
      - ../spire/agent:/run/spire/agent:ro
      - ../capiss_keys:/var/lib/capiss/keys:ro
    networks:
      - toolb_edge_net
      - capiss_edge_net
      - jiratool_edge_net
    profiles:
      - clients
      - tests

  rogue:
    build: ../agents/rogue
    container_name: spiffe-rogue
    labels:
      spiffe.workload: "rogue"
    depends_on:
      - tool-b-envoy
      - jira-tool-envoy
    environment:
      TOOL_B_URL: https://tool-b-envoy:8443
      JIRA_TOOL_URL: https://jira-tool-envoy:10443
      JIRA_MCP_URL: https://jira-mcp-envoy:11443
    command: ["/app/rogue.sh"]
    volumes:
      - ../spire/agent:/run/spire/agent:ro
      - ../capiss_keys:/var/lib/capiss/keys:ro
    networks:
      - toolb_edge_net
      - capiss_edge_net
      - jiratool_edge_net
      - jiramcp_edge_net
    profiles:
      - clients
      - tests

networks:
  toolb_edge_net: {}
  toolb_app_net: {}
  capiss_edge_net: {}
  capiss_app_net: {}
  jiratool_edge_net: {}
  jiratool_app_net: {}
  jiratool_upstream_net: {}
  jiramcp_edge_net: {}
  jiramcp_app_net: {}
  jiramcp_upstream_net: {}
