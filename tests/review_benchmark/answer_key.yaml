    paths: [scripts/rogue_node_tests.sh, compose/spiffe.compose.yml,
            services/capability-issuer-envoy/entrypoint.sh, services/tool-b-envoy/entrypoint.sh, .gitignore]
    leak_terms: [REQ-T-R9, token values were written, SHA-256 fingerprint]
