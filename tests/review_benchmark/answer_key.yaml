# Decision concern 8's measurement, fixed before its runs: the baseline, "better" and the outcomes, verbatim from
# section 9 of the author's severity analysis (step 1).
severity_measurement:
  decision: 'decision concern 8, step 3: candidate 1, "finish the scenario" (prompts/severity_scenario.md), against open+list'
  configuration: open+list+sev
  baseline_configuration: open+list
  baseline: '`open+list` first runs: detected 7 of 11 (5 by blocking); seen 9 of 11; false alarms 2 in 4 no-defect reviews
    (CL-1 F1 H, CL-2 CL2-F1 H; none on CL-3 or DC-1); 7 false-blocker candidates; FS-1 withheld by the publication check.'
  better: (1) RM-3 and RM-4 both detected by a confirmed match; the baseline had 0 of 6 such reviews at high across all
    three setups. (2) No baseline detection lost (RM-1, RM-2, RM-6, PB-1, PB-2, PB-3, FS-2); a failed or withheld review
    is rerun once. (3) No blocking or high finding on DC-1 or CL-3. (4) No more than one extra blocking or high finding
    on CL-1 and CL-2 together, each read by hand.
  outcomes: '**Worse:** (2) or (3) broken. **Inconclusive:** one of RM-3 and RM-4 detected and the guards hold; then repeat
    RM-3, RM-4, DC-1 and CL-2 once (about USD 4.5) before the owner decides. Also record by hand the new severities of
    the recurring under-rated (c8, c38, c4) and over-rated clusters, as a diagnostic.'
