# Answer key of the review benchmark, version 2 (agentic-sdlc-poc slice 4.5, S45-D2 to S45-D5): stage B's
# cases, their artifact types, configurations, expected findings and leak terms, and the match rule committed
# before any run. Stage A's key (version 1) is in the history at c325e7d; every result records its key's hash.
version: 2
stage: B
model: claude-opus-5-5
effort: high
budget: 60
lists_commit: 04f8df4
match_rule: 'A defect is detected by a finding rated blocking or high (stage A: kind blocking) that names one of
  the defect''s files, a line inside one of that file''s ranges, and at least one of its terms (case-insensitive,
  in the problem, evidence or failure scenario). A defect of absence is also detected by a blocking or high finding
  that names one of its absence terms and one of its absence places anywhere in the finding. A term counts only
  outside a verbatim quote of the expected lines, so a finding that only quotes the planted line goes to triage.
  A finding at the place without a term goes to triage as location only; a match rated medium or low counts as seen,
  not detected. On a no-defect case every blocking or high finding is a false alarm, and every blocking finding
  a false blocker; on any completed review a blocking finding at no expected place is a false-blocker candidate.
  The recheck case is detected when the recheck lists the earlier finding as re-raised and reports it again under
  its ID; a recheck that fails the launcher''s read check is a miss. Blinded confirmation applies this rule to each
  exported finding without its configuration.'
match_rule_sha256: 0db53541df45fbcfa09041d611f11aded4cbfe44b8b28474960add5abc874dcd
