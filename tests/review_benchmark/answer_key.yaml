# Answer key of the review benchmark (agentic-sdlc-poc slice 4.5, S45-D2 to S45-D5; versions below): stage B's
# cases, their artifact types, configurations, expected findings and leak terms, and the match rule committed
# before any run. Stage A's key (version 1) is in the history at c325e7d; every result records its key's hash.
# Version 3 adds RC-2, a recheck case whose answers all hold, and the match rule's sentence for it, after version 2's
# runs (the owner's decision on decision concern 4, 2026-11-13). It changes no earlier case and no earlier result's
# score, so version 2's results are read with it (earlier_key_sha256). Version 4, before any of their runs, raises the
# budget to 85 (the owner's approval of decision concern 8's measurement beyond the 60 calls, 2026-11-13: "complete it
# and do not wait for my approval"), adds the configuration open+list+sev to the 15 initial-review cases, and fixes the
# measurement's criteria (severity_measurement).
# Version 5 (round 2 of slice 4, R2-9; the owner, 2026-11-14), before any of its use: a match rated medium counts as
# detected, and a medium finding on a no-defect case as a false alarm, because R2-1 has blocking, high and medium
# findings fixed, so a medium finding is caught. Only the match rule's severities change. The results of versions 2
# and 4 (earlier_key_sha256) keep the score of their runs, made under the rule of their runs (blocking or high);
# `run_review_benchmark.py --rescore B` scores them again under this rule into a separate file, and the report shows
# both. Stage A's results carry the retired kinds blocking and advisory, and advisory held medium and low alike, so
# stage A is not re-scored. No reviewer call. The budget stays 85: decision concern 11, the raise to 85, is the owner's.
# Version 6 (round 2 of slice 4, R2-10; the owner, 2026-11-14), before their runs: two recheck cases of false answers,
# for both recheck wordings after R2-5 (the output section asks of each fix whether it adds a mechanism) and R2-7 (a
# recheck quotes the lines each rejection it accepts or re-raises rests on). RC-3: a `fixed:` answer that adds a
# process step where leaving the CI result out of the summary would do. RC-4: a `rejected:` answer that cites a real
# test whose fixture does not hold the finding's scenario. The match rule's recheck sentence names both, scored as
# RC-1's false fix is, and the launcher's quote check and report schema beside its read check. Both are planted on
# e842e97, as RC-1 and RC-2 are, so their reviewer gets that commit's AGENTS.md (discovered issue 18): a base with
# R2-4's text would put this directory and the slice's records, which describe the cases, into the copy. No earlier
# case or score changes; the results of versions 2 and 4 are re-scored as under version 5.
# Version 7 (round 3 of slice 4; the owner, 2026-11-17: "Round 3 of slice 4: I approve R3-1 to R3-4, the budget
# 85 → 95, and the probe and replays"), before its runs: the budget goes from 85 to 95, for RC-1 to RC-4 once each on
# the recheck wording the launcher ships (82 calls were spent). Only the budget changes, so version 6's results are
# read with this key (earlier_key_sha256) and keep their scores.
# Version 8 (round 4 of slice 4, R4-4; the owner, 2026-11-17: "approve the texts, budget 120, criterion fine"), before
# its runs: the budget goes from 95 to 120, the configuration open-R4+list (R4-1's initial mandate) is added to the 15
# initial-review cases and recheck-R4 (R4-1's recheck mandate) to RC-1 to RC-4, 19 calls (86 were spent). The match
# rule and every earlier case and score stay, so version 7's results are read with this key (earlier_key_sha256).
version: 8
stage: B
model: claude-opus-5-5
effort: high
budget: 120
lists_commit: 04f8df4
match_rule: 'A defect is detected by a finding rated blocking, high or medium (stage A: kind blocking) that names
  one of the defect''s files, a line inside one of that file''s ranges, and at least one of its terms
  (case-insensitive, in the problem, evidence or failure scenario). A defect of absence is also detected by a
  blocking, high or medium finding that names one of its absence terms and one of its absence places anywhere in the
  finding. A term counts only outside a verbatim quote of the expected lines, so a finding that only quotes the
  planted line goes to triage. A finding at the place without a term goes to triage as location only; a match rated
  low counts as seen, not detected. On a no-defect case every blocking, high or medium finding is a false alarm, and
  every blocking finding a false blocker; on any completed review a blocking finding at no expected place is a
  false-blocker candidate. The recheck case of a false answer (a false fix, a fix that adds a mechanism where
  changing a choice would do, or a false rejection) is detected when the recheck lists the earlier finding as
  re-raised and reports it again under its ID; a recheck that the launcher fails (its read check, quote check or
  report schema) is a miss. A recheck case of answers that hold is passed when the recheck lists every answer as
  accepted and reports none of the earlier findings again; an answer re-raised or listed as cannot determine, or a
  recheck that the launcher fails, is a miss, and every blocking, high or medium finding it reports is a false
  alarm, as on a no-defect case. Blinded confirmation applies this rule to each exported finding without its
  configuration.'
match_rule_sha256: 422d32c2be493a13c8a715f815763d95f3a76d6285daabe959af4dbdebb465fb
