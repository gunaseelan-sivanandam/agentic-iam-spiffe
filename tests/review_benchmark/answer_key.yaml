# Answer key of the review benchmark (agentic-sdlc-poc slice 2, POC-D10): the cases, their expected
# findings and leak terms, the budget and the decision rule. Committed before any run; every result
# line records this file's SHA-256, and `--report` refuses results made with another version.
version: 1
model: claude-opus-5-5
effort: high
budget: 26
decision_rule: >-
  Prefer the short prompt unless the full checklist detects at least two more real misses with no
  more false blockers; a smaller difference is reported as "no measurable difference". The union of
  both prompts' detections per case estimates what a second reviewer would add.
scoring: >-
  An expected finding is detected when a blocking finding names one of its files, a line inside one
  of that file's ranges, and at least one of its terms (case-insensitive, in problem, evidence or
  failure scenario). A location match without a term goes to triage. Every other blocking finding is
  listed for triage; on a clean case it is a false-blocker candidate. Each detection is confirmed by
  hand in the report.
cases:
  - id: RM-1
    kind: real_miss
    problem: DPL-001
    base: 6e8b2cb
    commit: 07520d7
    task: >-
      Milestone 3, steps 3 and 4: the capability issuer mints Biscuit capability tokens, and tool-b
      enforces them (identity is not authority).
    paths: [compose/spiffe.compose.yml, services/tool-b/server.py, services/tool-b/Dockerfile,
            services/capability-issuer/app.py, services/capability-issuer/Dockerfile,
            agents/agent-a/client.sh, scripts/rogue_node_tests.sh, README.md]
    leak_terms: [OPL-005, only need the public key, mounted into services that only]
    expected:
      - id: E1
        locations: [{file: compose/spiffe.compose.yml, ranges: [[94, 98]]}]
        terms: [private]
  - id: RM-2
    kind: real_miss
    problem: DPL-002
    base: 7d0de8b
    commit: 7226c2e
    task: >-
