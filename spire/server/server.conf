server {
  # Local trust domain for the lab.
  trust_domain = "example.org"
  data_dir = "/run/spire/server/data"

  # Server API for agents (no host port exposure in compose).
  bind_address = "0.0.0.0"
  bind_port = "8081"

  # Default admin/api sockets live under the data dir.
  socket_path = "/run/spire/server/data/private/api.sock"

  log_level = "INFO"
}

plugins {
  DataStore "sql" {
    plugin_data {
      database_type = "sqlite3"
      connection_string = "/run/spire/server/data/datastore.sqlite3"
    }
  }

  KeyManager "disk" {
    plugin_data {
      keys_path = "/run/spire/server/data/keys.json"
    }
  }

  NodeAttestor "join_token" {}
}
