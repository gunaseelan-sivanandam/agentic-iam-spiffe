agent {
  # Local trust domain for the lab.
  trust_domain = "varambu.org"
  data_dir = "/run/spire/agent/data"

  # Reach the SPIRE server over the compose network.
  server_address = "spire-server"
  server_port = "8081"

  # Allow bootstrap without a pre-shared bundle for this lab.
  insecure_bootstrap = true

  socket_path = "/run/spire/agent/private/api.sock"
  log_level = "INFO"
}

plugins {
  KeyManager "disk" {
    plugin_data {
      directory = "/run/spire/agent/data"
    }
  }

  NodeAttestor "join_token" {}

  # Keep docker attestation available for later workload integration.
  WorkloadAttestor "docker" {
    plugin_data {
      docker_socket_path = "unix:///var/run/docker.sock"
    }
  }
}
