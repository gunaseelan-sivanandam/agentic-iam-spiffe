agent {
  # Rogue agent config (tests only).
  trust_domain = "varambu.org"
  data_dir = "/run/spire/rogue/data"

  server_address = "spire-server"
  server_port = "8081"

  # Allow bootstrap without a pre-shared bundle for this lab.
  insecure_bootstrap = true

  socket_path = "/run/spire/rogue/private/api.sock"
  log_level = "INFO"
}

plugins {
  KeyManager "disk" {
    plugin_data {
      directory = "/run/spire/rogue/data"
    }
  }

  # Token file used by tests: /run/spire/rogue/missing_token (intentionally absent for C1).
  NodeAttestor "join_token" {}
}
