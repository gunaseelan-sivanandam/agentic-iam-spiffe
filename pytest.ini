[pytest]
testpaths = tests
addopts = -ra
markers =
    invariant: Security invariants that must always hold.
    boundary: Boundary and edge-case behavior checks.
    negative_control: Must-fail security tests with strict reason-code assertions.
    hybrid_critical: Low-mock critical-flow tests (mock externals only).
    guard_exempt: Temporary exemption from unit guard phase enforcement (disallowed in CI).
