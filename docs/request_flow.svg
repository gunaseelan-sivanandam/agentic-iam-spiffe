1.3716,827.0391,1271.3716,831.0391,1261.3716,835.0391,1265.3716,831.0391" style="stroke:#33445C;stroke-width:1;"/><line style="stroke:#33445C;stroke-width:1.5;" x1="366.4304" x2="1267.3716" y1="831.0391" y2="831.0391"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="169.7935" x="373.4304" y="810.8403">mTLS (SVID as client cert)</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.7764" x="373.4304" y="825.9731">+ capability token + call params</text></g><g class="message" data-entity-1="part7" data-entity-2="part8" id="msg11"><polygon fill="#33445C" points="1630.6841,871.3047,1640.6841,875.3047,1630.6841,879.3047,1634.6841,875.3047" style="stroke:#33445C;stroke-width:1;"/><line style="stroke:#33445C;stroke-width:1.5;" x1="1273.3716" x2="1636.6841" y1="875.3047" y2="875.3047"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="345.3125" x="1280.3716" y="855.106">x-verified-spiffe-id: spiffe://.../codex-jira-mcp-adapter</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="213.7764" x="1280.3716" y="870.2388">+ capability token + call params</text></g><path d="M1419,888.3047 L1419,995.3047 L1865,995.3047 L1865,898.3047 L1855,888.3047 L1419,888.3047" fill="#FFFEF0" style="stroke:#AAAAAA;stroke-width:0.5;"/><path d="M1855,888.3047 L1855,898.3047 L1865,898.3047 L1855,888.3047" fill="#FFFEF0" style="stroke:#AAAAAA;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="425.8242" x="1425" y="904.4434">Enforces (all must pass &#8212; any failure &#8594; DENY, upstream never called):</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="240.7559" x="1425" y="918.4121">&#9312; token signature valid and not expired</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength=