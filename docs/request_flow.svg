font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="179.2896" x="615.7263" y="231.2935">spiffe://.../jira-mcp-gateway</text></g><path d="M277,249.3594 L277,300.3594 L697,300.3594 L697,259.3594 L687,249.3594 L277,249.3594" fill="#FFFEF0" style="stroke:#AAAAAA;stroke-width:0.5;"/><path d="M687,249.3594 L687,259.3594 L697,259.3594 L687,249.3594" fill="#FFFEF0" style="stroke:#AAAAAA;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="399.0234" x="283" y="265.498">Every workload in the stack receives a SPIFFE identity from SPIRE.</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="289.7754" x="283" y="279.4668">SVIDs are short-lived and rotated automatically.</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="371.5254" x="283" y="293.4355">A workload that is not explicitly registered cannot obtain one.</text><rect fill="#EEEEEE" height="3" style="stroke:#EEEEEE;stroke-width:1;" width="1999.5454" x="0" y="326.832"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="1999.5454" y1="326.832" y2="326.832"/><line style="stroke:#000000;stroke-width:1;" x1="0" x2="1999.5454" y1="329.832" y2="329.832"/><rect fill="#EEEEEE" height="23.1328" style="stroke:#000000;stroke-width:2;" width="243.9565" x="877.7944" y="316.2656"/><text fill="#000000" font-family="Arial" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="225.4307" x="883.7944" y="332.3325">Per-request: authority minting</text><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg3"><polygon fill="#33445C" points="354.4304,366.5313,364.4304,370.5313,354.4304,374.5313,358.4304,370.5313" style="stroke:#33445C;stroke-width:1;"/><line style="stroke:#33445C;stroke-width:1.5;" x1="53.6248" x2="360.4304" y1="370.5313" y2="370.5313"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="187.0718" x="60.6248" y="365.4653">"summarise the IAM project"</text></g><path d="M237,383.5313 L237,448.5313 L494,448.5313 L494,393.5313 L484,383.5313 L237,383.5313" fill="#FFFEF0" style="stroke:#AAAAAA;stroke-width:0.5;"/><path d="M484,383.5313 L484,393.5313 L494,393.5313 L484,383.5313" fill="#FFFEF0" style="stroke:#AAAAAA;stroke-width:0.5;"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="236.707" x="243" y="399.6699">Translates instruction to precise intent:</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="145.1074" x="243" y="413.6387">aud = jira-mcp-gateway</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="174.1641" x="243" y="427.6074">act = read_project_summary</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="161.584" x="243" y="441.5762">res = jira-mcp:/project:IAM</text><g class="message" data-entity-1="part2" data-entity-2="part4" id="msg4"><polygon fill="#33445C" points="714.7668,486.6719,724.7668,490.6719,714.7668,494.6719,718.7668,490.6719" style="stroke:#33445C;stroke-width:1;"/><line style="stroke:#33445C;stroke-width:1.5;" x1="366.4304" x2="720.7668" y1="490.6719" y2="490.6719"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="169.7935" x="373.4304" y="470.4731">mTLS (SVID as client cert)</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="185.4341" x="373.4304" y="485.606">mint request {aud, act, res}</text></g><g class="message" data-entity-1="part4" data-entity-2="part5" id="msg5"><polygon fill="#33445C" points="900.3591,530.9375,910.3591,534.9375,900.3591,538.9375,904.3591,534.9375" style="stroke:#33445C;stroke-width:1;"/><line style="stroke:#33445C;stroke-width:1.5;" x1="726.7668" x2="906.3591" y1="534.9375" y2="534.9375"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="154.1021" x="733.7668" y="514.7388">verified caller SPIFFE ID</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="98.4712" x="733.7668" y="529.8716">+ mint request</text></g><g class="message" data-entity-1="part5" data-entity-2="part6" id="msg6"><polygon fill="#33445C" points="1175.1106,575.2031,1185.1106,579.2031,1175.1106,583.2031,1179.1106,579.2031" style="stroke:#33445C;stroke-width:1;"/><line style="stroke:#33445C;stroke-width:1.5;" x1="912.3591" x2="1181.1106" y1="579.2031" y2="579.2031"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="250.7515" x="919.3591" y="559.0044">may spiffe://.../codex-jira-mcp-adapter</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="138.4995" x="919.3591" y="574.1372">mint {aud, act, res}?</text></g><g class="message" data-entity-1="part6" data-entity-2="part5" id="msg7"><polygon fill="#33445C" points="923.3591,604.3359,913.3591,608.3359,923.3591,612.3359,919.3591,608.3359" style="stroke:#33445C;stroke-width:1;"/><line style="stroke:#33445C;stroke-width:1.5;stroke-dasharray:2,2;" x1="917.3591" x2="1186.1106" y1="608.3359" y2="608.3359"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="42.9673" x="929.3591" y="603.27">permit</text></g><g class="message" data-entity-1="part5" data-entity-2="part4" id="msg8"><polygon fill="#33445C" points="737.7668,648.6016,727.7668,652.6016,737.7668,656.6016,733.7668,652.6016" style="stroke:#33445C;stroke-width:1;"/><line style="stroke:#33445C;stroke-width:1.5;stroke-dasharray:2,2;" x1="731.7668" x2="911.3591" y1="652.6016" y2="652.6016"/><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="84.3477" x="743.7668" y="632.4028">Biscuit token</text><text fill="#000000" font-family="Arial" font-size="13" lengthAdjust="spacing" textLength="161.5923" x="743.7668" y=