<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" role="img" aria-labelledby="title desc">
  <title id="title">Agentic IAM network architecture with M4a/M4b Jira networks</title>
  <desc id="desc">C4-style network architecture. Rows show capiss, tool-b, and Jira. Columns separate edge networks, app networks, and internal state or upstream systems. M4a/M4b Jira networks are dashed runtime.</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .title { font: 700 28px Arial, sans-serif; fill: #142033; }
      .subtitle { font: 15px Arial, sans-serif; fill: #516070; }
      .zone { fill: #ffffff; stroke: #a5afbf; stroke-width: 2; rx: 16; }
      .zone-edge { fill: #edf6ff; stroke: #2f66b3; }
      .zone-app { fill: #edf8ef; stroke: #2b7a3d; }
      .zone-target { fill: #fff9ec; stroke: #b98922; stroke-width: 2.5; stroke-dasharray: 10 7; }
      .zone-upstream { fill: #f4f4f4; stroke: #666666; stroke-dasharray: 8 6; }
      .zone-title { font: 700 15px Arial, sans-serif; fill: #1f2a44; }
      .box { fill: #ffffff; stroke: #41516a; stroke-width: 1.5; rx: 9; }
      .box-envoy { fill: #e8f2ff; stroke: #2f66b3; }
      .box-app { fill: #edf8ef; stroke: #2b7a3d; }
      .box-state { fill: #f1edff; stroke: #6f55b5; }
      .box-policy { fill: #fff5df; stroke: #b76b00; }
      .box-target { fill: #fff3cf; stroke: #b98922; }
      .box-test { fill: #fff1f1; stroke: #b34b4b; }
      .label { font: 13px Arial, sans-serif; fill: #182437; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 12px Arial, sans-serif; fill: #4d5a6b; }
      .arrow { fill: none; stroke: #33445c; stroke-width: 2.2; marker-end: url(#arrow); }
      .arrow-mtls { stroke: #2f66b3; }
      .arrow-internal { stroke: #2b7a3d; }
      .arrow-state { stroke: #6f55b5; }
      .arrow-target { stroke: #b98922; stroke-dasharray: 8 6; }
      .arrow-workload { stroke: #2f66b3; stroke-dasharray: 6 6; }
      .edge-label { font: 12px Arial, sans-serif; fill: #2d3a4d; text-anchor: middle; }
      .note { fill: #fffef8; stroke: #c8b778; stroke-width: 1.4; rx: 10; }
      .note-text { font: 12px Arial, sans-serif; fill: #4d3c00; }
      .deny { fill: #fff7f7; stroke: #b34b4b; rx: 10; }
      .deny-text { font: 12px Arial, sans-serif; fill: #8a2b2b; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#33445c"/>
    </marker>
  </defs>

  <rect class="bg" width="1500" height="940"/>
  <text class="title" x="40" y="45">Agentic IAM with SPIFFE/SPIRE - Network Architecture</text>
  <text class="subtitle" x="40" y="72">Edge networks accept mTLS only at Envoy boundaries. App networks hold trusted services. M4a/M4b Jira networks are runtime.</text>

  <rect class="zone" x="40" y="100" width="1420" height="95"/>
  <text class="zone-title" x="65" y="128">SPIRE control plane</text>
  <rect class="box" x="220" y="140" width="150" height="36"/>
  <text class="label" x="295" y="158">spire-token-init</text>
  <rect class="box" x="500" y="140" width="150" height="36"/>
  <text class="label" x="575" y="158">spire-server</text>
  <rect class="box" x="780" y="140" width="150" height="36"/>
  <text class="label" x="855" y="158">spire-agent</text>
  <path class="arrow" d="M 370 158 H 500"/>
  <path class="arrow" d="M 650 158 H 780"/>
  <text class="small" x="1000" y="160">Workload API sockets are mounted only into registered workloads and Envoy boundaries.</text>

  <text class="zone-title" x="90" y="230">Edge network</text>
  <text class="zone-title" x="560" y="230">Application network</text>
  <text class="zone-title" x="1030" y="230">Policy, state, or upstream</text>

  <rect class="zone zone-edge" x="60" y="250" width="390" height="150"/>
  <text class="zone-title" x="85" y="278">capiss_edge_net</text>
  <rect class="box" x="95" y="310" width="110" height="36"/>
  <text class="label" x="150" y="328">agent-a</text>
  <rect class="box" x="95" y="355" width="110" height="36"/>
  <text class="label" x="150" y="373">rogue</text>
  <rect class="box box-envoy" x="255" y="322" width="155" height="42"/>
  <text class="label" x="332" y="343">capiss-envoy</text>

  <rect class="zone zone-app" x="530" y="250" width="390" height="150"/>
  <text class="zone-title" x="555" y="278">capiss_app_net</text>
  <rect class="box box-app" x="645" y="318" width="160" height="44"/>
  <text class="label" x="725" y="340">capability-issuer</text>

  <rect class="zone" x="1000" y="250" width="390" height="150"/>
  <text class="zone-title" x="1025" y="278">internal dependencies</text>
  <rect class="box box-policy" x="1040" y="318" width="110" height="44"/>
  <text class="label" x="1095" y="340">OPA</text>
  <rect class="box box-state" x="1220" y="318" width="110" height="44"/>
  <text class="label" x="1275" y="340">Redis</text>

  <path class="arrow arrow-mtls" d="M 205 328 H 255"/>
  <path class="arrow arrow-mtls" d="M 205 373 H 230 V 343 H 255"/>
  <text class="edge-label" x="232" y="315">mTLS</text>
  <path class="arrow arrow-internal" d="M 410 343 H 645"/>
  <text class="edge-label" x="525" y="330">trusted identity header</text>
  <path class="arrow arrow-internal" d="M 805 340 H 1040"/>
  <text class="edge-label" x="922" y="328">policy query</text>
  <path class="arrow arrow-state" d="M 805 356 H 1220"/>
  <text class="edge-label" x="1010" y="382">budget, registry, mint marker</text>

  <rect class="zone zone-edge" x="60" y="450" width="390" height="140"/>
  <text class="zone-title" x="85" y="478">toolb_edge_net</text>
  <rect class="box" x="95" y="520" width="110" height="36"/>
  <text class="label" x="150" y="538">agent-a</text>
  <rect class="box" x="95" y="560" width="110" height="36"/>
  <text class="label" x="150" y="578">rogue</text>
  <rect class="box box-envoy" x="255" y="530" width="155" height="42"/>
  <text class="label" x="332" y="551">tool-b-envoy</text>

  <rect class="zone zone-app" x="530" y="450" width="390" height="140"/>
  <text class="zone-title" x="555" y="478">toolb_app_net</text>
  <rect class="box box-app" x="655" y="520" width="140" height="44"/>
  <text class="label" x="725" y="542">tool-b</text>

  <rect class="zone" x="1000" y="450" width="390" height="140"/>
  <text class="zone-title" x="1025" y="478">shared state</text>
  <rect class="box box-state" x="1140" y="520" width="110" height="44"/>
  <text class="label" x="1195" y="542">Redis</text>

  <path class="arrow arrow-mtls" d="M 205 538 H 255"/>
  <path class="arrow arrow-mtls" d="M 205 578 H 230 V 551 H 255"/>
  <text class="edge-label" x="232" y="525">mTLS</text>
  <path class="arrow arrow-internal" d="M 410 551 H 655"/>
  <text class="edge-label" x="525" y="538">trusted identity header</text>
  <path class="arrow arrow-state" d="M 795 542 H 1140"/>
  <text class="edge-label" x="967" y="530">spend/rate and discovery writes</text>

  <rect class="zone zone-target" x="60" y="650" width="390" height="165"/>
  <text class="zone-title" x="85" y="678">jiratool_edge_net (M4a/M4b)</text>
  <rect class="box" x="95" y="720" width="110" height="36"/>
  <text class="label" x="150" y="738">agent-a</text>
  <rect class="box" x="95" y="765" width="110" height="36"/>
  <text class="label" x="150" y="783">rogue</text>
  <rect class="box box-target" x="255" y="725" width="155" height="48"/>
  <text class="label" x="332" y="743">jira-tool-envoy</text>
  <text class="small" x="332" y="762" text-anchor="middle">host:10443</text>

  <rect class="zone zone-target" x="530" y="650" width="390" height="165"/>
  <text class="zone-title" x="555" y="678">jiratool_app_net (M4a/M4b)</text>
  <rect class="box box-target" x="655" y="720" width="140" height="44"/>
  <text class="label" x="725" y="742">jira-tool</text>
  <rect class="box box-state" x="655" y="775" width="140" height="34"/>
  <text class="label" x="725" y="792">Redis</text>

  <rect class="zone zone-upstream" x="1000" y="650" width="390" height="165"/>
  <text class="zone-title" x="1025" y="678">Jira upstream side, not edge</text>
  <rect class="box box-target" x="1040" y="720" width="130" height="44"/>
  <text class="label" x="1105" y="742">jira-mock</text>
  <rect class="box" x="1220" y="720" width="130" height="44"/>
  <text class="label" x="1285" y="742">Jira Cloud</text>
  <text class="small" x="1030" y="793">Mock has IAM and NAS data, but is upstream-only and not host-exposed.</text>

  <path class="arrow arrow-target" d="M 205 738 H 255"/>
  <path class="arrow arrow-target" d="M 205 783 H 230 V 749 H 255"/>
  <text class="edge-label" x="232" y="725">mTLS</text>
  <path class="arrow arrow-target" d="M 410 749 H 655"/>
  <text class="edge-label" x="525" y="736">trusted identity header</text>
  <path class="arrow arrow-state" d="M 725 764 V 775"/>
  <text class="edge-label" x="785" y="773">budget/rate</text>
  <path class="arrow arrow-target" d="M 795 742 H 1040"/>
  <text class="edge-label" x="917" y="730">authorized upstream only</text>
  <path class="arrow arrow-target" d="M 795 742 H 980 V 742 H 1220"/>
  <text class="edge-label" x="1007" y="712">optional live mode</text>

  <rect class="deny" x="60" y="835" width="390" height="55"/>
  <text class="deny-text" x="85" y="858">M4a/M4b edge clients do not route directly to jira-tool or jira-mock.</text>
  <text class="deny-text" x="85" y="878">Negative tests reach jira-tool-envoy, then fail by local authorization.</text>

  <rect class="note" x="530" y="835" width="390" height="55"/>
  <text class="note-text" x="555" y="858">jira-tool consumes root-token budget/rate from Redis before upstream use.</text>
  <text class="note-text" x="555" y="878">Project mismatch and read-token writes deny before any Jira/mock call.</text>

  <rect class="note" x="1000" y="835" width="390" height="55"/>
  <text class="note-text" x="1025" y="858">Live smoke must first prove the broad API key can read IAM and NAS.</text>
  <text class="note-text" x="1025" y="878">The protected path still allows only OPA-authorized IAM.</text>
</svg>
