<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1180" viewBox="0 0 1680 1180" role="img" aria-labelledby="title desc">
  <title id="title">Agentic IAM SPIFFE/SPIRE Network Architecture</title>
  <desc id="desc">Layered network architecture diagram. Columns separate caller, Envoy edge, protected application, governance state, and upstream systems. Rows separate the capiss, tool-b, M4 Jira, and M5 Codex Jira MCP paths.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fa; }
      .title { font: 700 28px Arial, sans-serif; fill: #162033; }
      .subtitle { font: 15px Arial, sans-serif; fill: #4f5d70; }
      .col { fill: #ffffff; stroke: #ccd3dd; stroke-width: 1.4; rx: 14; }
      .col-title { font: 700 15px Arial, sans-serif; fill: #253247; text-anchor: middle; }
      .lane { fill: #ffffff; stroke: #b9c2cf; stroke-width: 1.5; rx: 14; }
      .lane-capiss { fill: #f7fbff; stroke: #78a8df; }
      .lane-toolb { fill: #f8fcf8; stroke: #7cbf88; }
      .lane-m4 { fill: #fffaf0; stroke: #d2a955; }
      .lane-m5 { fill: #f8f5ff; stroke: #9075d8; }
      .lane-title { font: 700 14px Arial, sans-serif; fill: #26334a; }
      .box { fill: #ffffff; stroke: #45546b; stroke-width: 1.4; rx: 8; }
      .caller { fill: #f4f7fb; stroke: #5f718a; }
      .envoy { fill: #eaf3ff; stroke: #2d67b2; }
      .app { fill: #edf8ef; stroke: #2d7b42; }
      .state { fill: #f1edff; stroke: #6b54b6; }
      .policy { fill: #fff4dd; stroke: #b87518; }
      .upstream { fill: #f4f4f4; stroke: #666; }
      .m4 { fill: #fff4d8; stroke: #b98922; }
      .m5 { fill: #efe9ff; stroke: #6b4cc2; }
      .deny { fill: #fff3f3; stroke: #b34b4b; }
      .label { font: 13px Arial, sans-serif; fill: #162033; text-anchor: middle; dominant-baseline: middle; }
      .label-small { font: 11.5px Arial, sans-serif; fill: #4c5a6a; text-anchor: middle; dominant-baseline: middle; }
      .note { font: 12px Arial, sans-serif; fill: #465568; }
      .note-bold { font: 700 12px Arial, sans-serif; fill: #26334a; }
      .arrow { fill: none; stroke: #38475e; stroke-width: 2.2; marker-end: url(#arrow); }
      .arrow-blue { stroke: #2d67b2; }
      .arrow-green { stroke: #2d7b42; }
      .arrow-purple { stroke: #6b4cc2; }
      .arrow-brown { stroke: #b98922; }
      .arrow-state { stroke: #6b54b6; }
      .arrow-deny { stroke: #b34b4b; stroke-dasharray: 7 6; }
      .arrow-live { stroke-dasharray: 8 6; }
      .flow-label { font: 11.5px Arial, sans-serif; fill: #344258; text-anchor: middle; }
      .legend { fill: #ffffff; stroke: #c9d1dc; stroke-width: 1.2; rx: 10; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38475e"/>
    </marker>
  </defs>

  <rect class="bg" width="1680" height="1180"/>
  <text class="title" x="48" y="46">Agentic IAM with SPIFFE/SPIRE - Network Architecture</text>
  <text class="subtitle" x="48" y="74">Standard layered view: callers cross only Envoy edge boundaries; protected services enforce capiss tokens and local policy before upstream use.</text>

  <rect class="col" x="40" y="115" width="250" height="980"/>
  <rect class="col" x="320" y="115" width="250" height="980"/>
  <rect class="col" x="600" y="115" width="250" height="980"/>
  <rect class="col" x="880" y="115" width="250" height="980"/>
  <rect class="col" x="1160" y="115" width="470" height="980"/>
  <text class="col-title" x="165" y="145">Caller / Workload</text>
  <text class="col-title" x="445" y="145">SPIFFE mTLS Edge</text>
  <text class="col-title" x="725" y="145">Protected App / PEP</text>
  <text class="col-title" x="1005" y="145">Governance State</text>
  <text class="col-title" x="1395" y="145">Policy / Upstream</text>

  <rect class="lane" x="40" y="175" width="1590" height="110"/>
  <text class="lane-title" x="65" y="202">SPIRE control plane</text>
  <rect class="box" x="95" y="222" width="145" height="38"/>
  <text class="label" x="167" y="241">spire-token-init</text>
  <rect class="box" x="675" y="222" width="145" height="38"/>
  <text class="label" x="747" y="241">spire-server</text>
  <rect class="box" x="955" y="222" width="145" height="38"/>
  <text class="label" x="1027" y="241">spire-agent</text>
  <path class="arrow" d="M 240 241 H 675"/>
  <path class="arrow" d="M 820 241 H 955"/>
  <text class="flow-label" x="455" y="229">entry create</text>
  <text class="flow-label" x="887" y="229">node attestation</text>
  <text class="note" x="1190" y="232">Workload API socket is mounted only into registered workloads and Envoy boundaries.</text>
  <text class="note" x="1190" y="253">SVIDs are fetched locally; application traffic still enters through Envoy.</text>

  <rect class="lane lane-capiss" x="40" y="315" width="1590" height="150"/>
  <text class="lane-title" x="65" y="342">Capability issuer path</text>
  <rect class="box caller" x="95" y="374" width="145" height="48"/>
  <text class="label" x="167" y="390">agent-a / adapter</text>
  <text class="label-small" x="167" y="409">authorized callers</text>
  <rect class="box envoy" x="365" y="374" width="160" height="48"/>
  <text class="label" x="445" y="390">capability-issuer</text>
  <text class="label-small" x="445" y="409">envoy :9443</text>
  <rect class="box app" x="650" y="374" width="150" height="48"/>
  <text class="label" x="725" y="390">capability</text>
  <text class="label-small" x="725" y="409">issuer</text>
  <rect class="box state" x="930" y="354" width="150" height="38"/>
  <text class="label" x="1005" y="373">Redis</text>
  <rect class="box policy" x="1215" y="354" width="150" height="38"/>
  <text class="label" x="1290" y="373">OPA</text>
  <rect class="box state" x="1215" y="407" width="150" height="38"/>
  <text class="label" x="1290" y="426">capiss keys</text>
  <path class="arrow arrow-blue" d="M 240 398 H 365"/>
  <path class="arrow arrow-green" d="M 525 398 H 650"/>
  <path class="arrow arrow-state" d="M 800 382 H 930"/>
  <path class="arrow arrow-green" d="M 800 398 H 1215"/>
  <path class="arrow arrow-state" d="M 800 414 H 1215"/>
  <text class="flow-label" x="303" y="386">mTLS</text>
  <text class="flow-label" x="588" y="386">trusted identity</text>
  <text class="flow-label" x="865" y="370">budget / registry</text>
  <text class="flow-label" x="1040" y="386">policy query</text>
  <text class="flow-label" x="1040" y="436">sign / verify</text>

  <rect class="lane lane-toolb" x="40" y="495" width="1590" height="135"/>
  <text class="lane-title" x="65" y="522">Tool-b protected resource path</text>
  <rect class="box caller" x="95" y="552" width="145" height="46"/>
  <text class="label" x="167" y="575">agent-a / rogue</text>
  <rect class="box envoy" x="365" y="552" width="160" height="46"/>
  <text class="label" x="445" y="575">tool-b-envoy</text>
  <rect class="box app" x="650" y="552" width="150" height="46"/>
  <text class="label" x="725" y="575">tool-b</text>
  <rect class="box state" x="930" y="552" width="150" height="46"/>
  <text class="label" x="1005" y="568">Redis</text>
  <text class="label-small" x="1005" y="586">spend / discovery</text>
  <path class="arrow arrow-blue" d="M 240 575 H 365"/>
  <path class="arrow arrow-green" d="M 525 575 H 650"/>
  <path class="arrow arrow-state" d="M 800 575 H 930"/>
  <path class="arrow arrow-deny" d="M 167 598 V 616 H 445"/>
  <text class="flow-label" x="303" y="563">mTLS</text>
  <text class="flow-label" x="588" y="563">trusted identity</text>
  <text class="flow-label" x="865" y="563">budget/rate</text>
  <text class="flow-label" x="300" y="615">negative tests fail at Envoy/app</text>

  <rect class="lane lane-m4" x="40" y="660" width="1590" height="160"/>
  <text class="lane-title" x="65" y="687">M4a/M4b Jira tool path</text>
  <rect class="box caller" x="95" y="724" width="145" height="46"/>
  <text class="label" x="167" y="747">agent-a / rogue</text>
  <rect class="box m4" x="365" y="724" width="160" height="46"/>
  <text class="label" x="445" y="739">jira-tool-envoy</text>
  <text class="label-small" x="445" y="757">host :10443</text>
  <rect class="box m4" x="650" y="724" width="150" height="46"/>
  <text class="label" x="725" y="747">jira-tool PEP</text>
  <rect class="box state" x="930" y="724" width="150" height="46"/>
  <text class="label" x="1005" y="740">Redis</text>
  <text class="label-small" x="1005" y="758">budget/rate</text>
  <rect class="box upstream" x="1215" y="705" width="145" height="42"/>
  <text class="label" x="1287" y="726">jira-mock</text>
  <rect class="box upstream" x="1425" y="705" width="145" height="42"/>
  <text class="label" x="1497" y="726">Jira Cloud</text>
  <rect class="box deny" x="1215" y="760" width="355" height="36"/>
  <text class="label" x="1392" y="778">upstream has broad IAM/NAS; protected path allows IAM</text>
  <path class="arrow arrow-brown" d="M 240 747 H 365"/>
  <path class="arrow arrow-brown" d="M 525 747 H 650"/>
  <path class="arrow arrow-state" d="M 800 747 H 930"/>
  <path class="arrow arrow-brown" d="M 800 733 H 1215"/>
  <path class="arrow arrow-brown arrow-live" d="M 800 733 H 1180 V 726 H 1425"/>
  <text class="flow-label" x="303" y="735">mTLS</text>
  <text class="flow-label" x="588" y="735">trusted identity</text>
  <text class="flow-label" x="865" y="735">consume before upstream</text>
  <text class="flow-label" x="1008" y="721">mock default</text>
  <text class="flow-label" x="1190" y="704">explicit live mode</text>

  <rect class="lane lane-m5" x="40" y="850" width="1590" height="185"/>
  <text class="lane-title" x="65" y="877">M5 Codex Jira MCP path</text>
  <rect class="box m5" x="95" y="910" width="145" height="72"/>
  <text class="label" x="167" y="927">Codex MCP</text>
  <text class="label-small" x="167" y="946">launcher stdio</text>
  <text class="label-small" x="167" y="964">codex adapter</text>
  <rect class="box m5" x="365" y="923" width="160" height="50"/>
  <text class="label" x="445" y="939">jira-mcp-envoy</text>
  <text class="label-small" x="445" y="958">host :11443</text>
  <rect class="box m5" x="650" y="923" width="150" height="50"/>
  <text class="label" x="725" y="939">jira-mcp</text>
  <text class="label-small" x="725" y="958">gateway PEP</text>
  <rect class="box state" x="930" y="923" width="150" height="50"/>
  <text class="label" x="1005" y="939">Redis</text>
  <text class="label-small" x="1005" y="958">budget/rate</text>
  <rect class="box upstream" x="1215" y="900" width="145" height="42"/>
  <text class="label" x="1287" y="921">jira-mcp-mock</text>
  <rect class="box upstream" x="1425" y="900" width="145" height="42"/>
  <text class="label" x="1497" y="921">Jira Cloud</text>
  <rect class="box deny" x="1215" y="955" width="355" height="52"/>
  <text class="label" x="1392" y="970">bounded summary and story create only</text>
  <text class="label-small" x="1392" y="990">NAS denied at capiss before gateway/Jira use</text>
  <path class="arrow arrow-purple" d="M 240 948 H 365"/>
  <path class="arrow arrow-purple" d="M 525 948 H 650"/>
  <path class="arrow arrow-state" d="M 800 948 H 930"/>
  <path class="arrow arrow-purple" d="M 800 933 H 1215"/>
  <path class="arrow arrow-purple arrow-live" d="M 800 933 H 1180 V 921 H 1425"/>
  <path class="arrow arrow-purple" d="M 95 946 H 70 V 398 H 365"/>
  <text class="flow-label" x="303" y="936">mTLS</text>
  <text class="flow-label" x="588" y="936">trusted identity</text>
  <text class="flow-label" x="865" y="936">consume before upstream</text>
  <text class="flow-label" x="1008" y="921">mock default</text>
  <text class="flow-label" x="1190" y="899">explicit live mode</text>
  <text class="flow-label" x="142" y="480">mint aud=jira-mcp-gateway</text>

  <rect class="legend" x="40" y="1062" width="1590" height="78"/>
  <text class="note-bold" x="65" y="1087">Runtime boundary notes</text>
  <text class="note" x="65" y="1111">1. Envoys terminate SPIFFE mTLS and inject trusted workload identity headers; app listeners are private network members.</text>
  <text class="note" x="65" y="1132">2. Capiss policies authorize IAM only for M4 Jira and M5 Jira MCP authorities. NAS is useful as a broad-upstream but protected-denied proof.</text>
  <text class="note" x="875" y="1111">3. Jira credentials are mounted only into Jira PEP containers in explicit live mode. Host .env access is outside this runtime boundary.</text>
  <text class="note" x="875" y="1132">4. Solid arrows are normal flows. Dashed arrows are negative/live-optional paths. Flow direction is left-to-right except the M5 mint back to capiss.</text>
</svg>
