<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1120" viewBox="0 0 1680 1120" role="img" aria-labelledby="title desc">
  <title id="title">Agentic IAM component architecture</title>
  <desc id="desc">C4-style component architecture diagram. Columns separate workload clients, SPIFFE mTLS edge proxies, application PEP services, governance state and policy, and upstream systems. Rows show SPIRE, capability issuance, tool-b, M4 Jira, and M5 Codex Jira MCP flows.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fa; }
      .title { font: 700 30px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 15px Arial, sans-serif; fill: #586579; }
      .col-head { fill: #ffffff; stroke: #c0c9d8; stroke-width: 1.2; }
      .col-label { font: 700 15px Arial, sans-serif; fill: #273447; text-anchor: middle; }
      .lane { fill: #ffffff; stroke: #c0c9d8; stroke-width: 1.2; }
      .lane-capiss { fill: #f4f9ff; stroke: #63a0ff; }
      .lane-toolb { fill: #f7fcf8; stroke: #58b76e; }
      .lane-m4 { fill: #fffbf3; stroke: #c8942d; }
      .lane-m5 { fill: #fbf8ff; stroke: #8a62e8; }
      .lane-title { font: 700 14px Arial, sans-serif; fill: #273447; }
      .box { fill: #ffffff; stroke: #41516a; stroke-width: 1.6; rx: 6; }
      .client { fill: #f4f7fc; stroke: #50627d; }
      .envoy { fill: #edf5ff; stroke: #2f66b3; }
      .app { fill: #eef8f0; stroke: #2b7a3d; }
      .state { fill: #f2edff; stroke: #6f55b5; }
      .policy { fill: #fff5df; stroke: #b76b00; }
      .upstream { fill: #f5f5f5; stroke: #666666; }
      .deny { fill: #fff3f3; stroke: #c94040; }
      .label { font: 13px Arial, sans-serif; fill: #182437; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 12px Arial, sans-serif; fill: #536174; }
      .note { font: 12px Arial, sans-serif; fill: #526075; }
      .note-bold { font: 700 13px Arial, sans-serif; fill: #273447; }
      .arrow { fill: none; stroke: #33445c; stroke-width: 2.4; marker-end: url(#arrow); }
      .blue { stroke: #2f66b3; }
      .green { stroke: #2b7a3d; }
      .purple { stroke: #6f55b5; }
      .brown { stroke: #b98922; }
      .dashed { stroke-dasharray: 8 7; }
      .thin { stroke-width: 1.5; }
      .edge-label { font: 11px Arial, sans-serif; fill: #3d4858; text-anchor: middle; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#33445c"/>
    </marker>
  </defs>

  <rect class="bg" width="1680" height="1120"/>
  <text class="title" x="48" y="48">Agentic IAM with SPIFFE/SPIRE - Component Architecture</text>
  <text class="subtitle" x="48" y="76">C4-style current-state component view with M4a/M4b Jira and M5 Codex Jira MCP paths.</text>

  <rect class="col-head" x="40" y="115" width="250" height="60"/>
  <rect class="col-head" x="320" y="115" width="250" height="60"/>
  <rect class="col-head" x="600" y="115" width="250" height="60"/>
  <rect class="col-head" x="880" y="115" width="250" height="60"/>
  <rect class="col-head" x="1160" y="115" width="470" height="60"/>
  <text class="col-label" x="165" y="148">Workload Clients</text>
  <text class="col-label" x="445" y="148">SPIFFE mTLS Edge</text>
  <text class="col-label" x="725" y="148">Application / PEP</text>
  <text class="col-label" x="1005" y="148">Governance</text>
  <text class="col-label" x="1395" y="148">Policy / Upstream</text>

  <line x1="290" y1="175" x2="290" y2="1048" stroke="#d1d8e4"/>
  <line x1="320" y1="175" x2="320" y2="1048" stroke="#d1d8e4"/>
  <line x1="570" y1="175" x2="570" y2="1048" stroke="#d1d8e4"/>
  <line x1="600" y1="175" x2="600" y2="1048" stroke="#d1d8e4"/>
  <line x1="850" y1="175" x2="850" y2="1048" stroke="#d1d8e4"/>
  <line x1="880" y1="175" x2="880" y2="1048" stroke="#d1d8e4"/>
  <line x1="1130" y1="175" x2="1130" y2="1048" stroke="#d1d8e4"/>
  <line x1="1160" y1="175" x2="1160" y2="1048" stroke="#d1d8e4"/>

  <rect class="lane" x="40" y="175" width="1590" height="110"/>
  <text class="lane-title" x="65" y="206">SPIRE control plane</text>
  <rect class="box" x="95" y="224" width="145" height="38"/>
  <text class="label" x="167" y="243">spire-token-init</text>
  <rect class="box" x="675" y="224" width="145" height="38"/>
  <text class="label" x="747" y="243">spire-server</text>
  <rect class="box" x="955" y="224" width="145" height="38"/>
  <text class="label" x="1027" y="243">spire-agent</text>
  <path class="arrow thin" d="M 240 243 H 675"/>
  <path class="arrow thin" d="M 820 243 H 955"/>
  <text class="small" x="1190" y="242">Issues SVIDs only to registered workloads and Envoy boundaries.</text>

  <rect class="lane lane-capiss" x="40" y="315" width="1590" height="150"/>
  <text class="lane-title" x="65" y="347">Capability issuance path</text>
  <rect class="box client" x="95" y="376" width="145" height="46"/>
  <text class="label" x="167" y="399">agent-a / rogue</text>
  <rect class="box envoy" x="365" y="376" width="160" height="46"/>
  <text class="label" x="445" y="399">capiss-envoy</text>
  <rect class="box app" x="650" y="376" width="150" height="46"/>
  <text class="label" x="725" y="399">capability issuer</text>
  <rect class="box state" x="930" y="356" width="150" height="38"/>
  <text class="label" x="1005" y="375">Redis</text>
  <rect class="box policy" x="1215" y="356" width="150" height="38"/>
  <text class="label" x="1290" y="375">OPA</text>
  <rect class="box state" x="1215" y="410" width="150" height="38"/>
  <text class="label" x="1290" y="429">signing keys</text>
  <path class="arrow blue" d="M 240 399 H 365"/>
  <path class="arrow green" d="M 525 399 H 650"/>
  <path class="arrow purple" d="M 800 383 H 930"/>
  <path class="arrow green" d="M 800 399 H 1215"/>
  <path class="arrow purple" d="M 800 415 H 1215"/>
  <text class="edge-label" x="585" y="389">trusted identity</text>

  <rect class="lane lane-toolb" x="40" y="495" width="1590" height="135"/>
  <text class="lane-title" x="65" y="527">Tool-B protected resource path</text>
  <rect class="box client" x="95" y="553" width="145" height="46"/>
  <text class="label" x="167" y="576">agent-a / rogue</text>
  <rect class="box envoy" x="365" y="553" width="160" height="46"/>
  <text class="label" x="445" y="576">tool-b-envoy</text>
  <rect class="box app" x="650" y="553" width="150" height="46"/>
  <text class="label" x="725" y="576">tool-b</text>
  <rect class="box state" x="930" y="553" width="150" height="46"/>
  <text class="label" x="1005" y="576">Redis spend</text>
  <path class="arrow blue" d="M 240 576 H 365"/>
  <path class="arrow green" d="M 525 576 H 650"/>
  <path class="arrow purple" d="M 800 576 H 930"/>

  <rect class="lane lane-m4" x="40" y="660" width="1590" height="160"/>
  <text class="lane-title" x="65" y="692">M4a/M4b Jira tool path</text>
  <rect class="box client" x="95" y="724" width="145" height="46"/>
  <text class="label" x="167" y="747">agent-a / rogue</text>
  <rect class="box envoy" x="365" y="724" width="160" height="46"/>
  <text class="label" x="445" y="747">jira-tool-envoy</text>
  <rect class="box app" x="650" y="724" width="150" height="46"/>
  <text class="label" x="725" y="747">jira-tool PEP</text>
  <rect class="box state" x="930" y="724" width="150" height="46"/>
  <text class="label" x="1005" y="747">Redis budget</text>
  <rect class="box upstream" x="1215" y="705" width="145" height="40"/>
  <text class="label" x="1287" y="725">jira-mock</text>
  <rect class="box upstream" x="1425" y="705" width="145" height="40"/>
  <text class="label" x="1497" y="725">Jira Cloud</text>
  <rect class="box deny" x="1215" y="760" width="355" height="36"/>
  <text class="label" x="1392" y="778">IAM allowed; NAS denied before upstream</text>
  <path class="arrow brown" d="M 240 747 H 365"/>
  <path class="arrow brown" d="M 525 747 H 650"/>
  <path class="arrow purple" d="M 800 747 H 930"/>
  <path class="arrow brown dashed" d="M 1080 747 H 1190 V 725 H 1215"/>
  <path class="arrow brown dashed" d="M 1360 725 H 1425"/>

  <rect class="lane lane-m5" x="40" y="850" width="1590" height="180"/>
  <text class="lane-title" x="65" y="882">M5 Codex Jira MCP path</text>
  <rect class="box client" x="95" y="910" width="145" height="58"/>
  <text class="label" x="167" y="933">Codex launcher</text>
  <text class="label" x="167" y="950">docker exec -T</text>
  <rect class="box client" x="95" y="980" width="145" height="38"/>
  <text class="label" x="167" y="999">MCP adapter</text>
  <rect class="box envoy" x="365" y="930" width="160" height="46"/>
  <text class="label" x="445" y="953">jira-mcp-envoy</text>
  <rect class="box app" x="650" y="930" width="150" height="46"/>
  <text class="label" x="725" y="953">jira-mcp gateway</text>
  <rect class="box state" x="930" y="930" width="150" height="46"/>
  <text class="label" x="1005" y="953">Redis budget</text>
  <rect class="box upstream" x="1215" y="910" width="145" height="40"/>
  <text class="label" x="1287" y="930">mcp mock</text>
  <rect class="box upstream" x="1425" y="910" width="145" height="40"/>
  <text class="label" x="1497" y="930">Jira Cloud</text>
  <rect class="box deny" x="1215" y="970" width="355" height="38"/>
  <text class="label" x="1392" y="989">IAM via capiss; NAS denied at mint</text>
  <path class="arrow purple" d="M 240 953 H 365"/>
  <path class="arrow purple" d="M 525 953 H 650"/>
  <path class="arrow purple" d="M 800 953 H 930"/>
  <path class="arrow purple" d="M 1080 953 H 1190 V 930 H 1215"/>
  <path class="arrow purple dashed" d="M 1360 930 H 1425"/>
  <path class="arrow purple" d="M 95 999 H 70 V 399 H 365"/>
  <text class="edge-label" x="92" y="966">mint to capiss</text>

  <rect class="lane" x="40" y="1060" width="1590" height="44"/>
  <text class="note-bold" x="65" y="1086">Standard:</text>
  <text class="note" x="145" y="1086">Rows are runtime paths, columns are trust zones, solid arrows are normal flows, dashed arrows are mock/live upstream options, and arrows point in call direction.</text>
</svg>
